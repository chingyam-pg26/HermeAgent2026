<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* ---------- Tokens ---------- */
  :root {
    --bg: #fafaf9;
    --surface: #ffffff;
    --ink: #18181b;
    --ink-secondary: #52525b;
    --muted: #a1a1aa;
    --border: #e4e4e7;
    --border-strong: #d4d4d8;
    --accent: #0d9488;          /* teal-600 */
    --accent-contrast: #ffffff;
    --accent-soft: #ccfbf1;    /* teal-100 */
    --danger: #dc2626;
    --shadow: 0 1px 2px rgba(24,24,27,.04), 0 4px 16px rgba(24,24,27,.06);
    --radius: 12px;
    --font-display: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
    --font-body: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  [data-theme="dark"] {
    --bg: #09090b;
    --surface: #18181b;
    --ink: #fafafa;
    --ink-secondary: #a1a1aa;
    --muted: #71717a;
    --border: #27272a;
    --border-strong: #3f3f46;
    --accent: #14b8a6;
    --accent-contrast: #04211d;
    --accent-soft: #134e4a;
    --danger: #f87171;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--ink);
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    padding: clamp(16px, 4vw, 48px) 16px 64px;
    transition: background .25s ease, color .25s ease;
  }

  .app { width: 100%; max-width: 520px; }

  /* ---------- Header ---------- */
  .header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 28px;
  }
  .header h1 {
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }
  .date {
    margin-top: 4px;
    font-size: 13px;
    color: var(--muted);
  }

  .theme-toggle {
    flex: none;
    width: 40px; height: 40px;
    display: grid; place-items: center;
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: 10px;
    color: var(--ink-secondary);
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .theme-toggle:hover { border-color: var(--border-strong); }
  .theme-toggle:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .theme-toggle svg { width: 18px; height: 18px; }
  .theme-toggle .moon { display: none; }
  [data-theme="dark"] .theme-toggle .sun { display: none; }
  [data-theme="dark"] .theme-toggle .moon { display: block; }

  /* ---------- Add bar ---------- */
  .add-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  .add-input {
    flex: 1;
    min-height: 48px;
    padding: 12px 16px;
    font: inherit;
    font-size: 15px;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    transition: border-color .15s ease;
  }
  .add-input::placeholder { color: var(--muted); }
  .add-input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent), var(--shadow);
  }
  .add-btn {
    flex: none;
    min-width: 48px;
    min-height: 48px;
    display: grid; place-items: center;
    border: none;
    border-radius: var(--radius);
    background: var(--accent);
    color: var(--accent-contrast);
    cursor: pointer;
    transition: filter .15s ease, transform .1s ease;
  }
  .add-btn:hover { filter: brightness(1.08); }
  .add-btn:active { transform: scale(.96); }
  .add-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .add-btn svg { width: 20px; height: 20px; }

  /* ---------- Progress ---------- */
  .progress {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    font-size: 13px;
    color: var(--ink-secondary);
  }
  .progress-track {
    flex: 1;
    height: 4px;
    border-radius: 99px;
    background: var(--border);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    border-radius: 99px;
    background: var(--accent);
    transition: width .3s ease;
  }
  .progress-count { font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* ---------- Filters ---------- */
  .filters {
    display: inline-flex;
    gap: 2px;
    padding: 3px;
    background: color-mix(in srgb, var(--ink) 5%, transparent);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 16px;
  }
  .filter-btn {
    border: none;
    background: transparent;
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-secondary);
    padding: 7px 14px;
    min-height: 36px;
    border-radius: 8px;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .filter-btn:hover { color: var(--ink); }
  .filter-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .filter-btn[aria-pressed="true"] {
    background: var(--surface);
    color: var(--ink);
    box-shadow: 0 1px 2px rgba(0,0,0,.08);
  }

  /* ---------- List ---------- */
  .list { list-style: none; display: flex; flex-direction: column; gap: 8px; }

  .item {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 56px;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    transition: border-color .15s ease;
  }
  .item:hover { border-color: var(--border-strong); }
  .item.leaving {
    opacity: 0;
    transform: translateX(12px);
    transition: opacity .18s ease, transform .18s ease;
  }

  .check {
    flex: none;
    width: 26px; height: 26px;
    display: grid; place-items: center;
    border: 2px solid var(--border-strong);
    border-radius: 50%;
    background: transparent;
    cursor: pointer;
    padding: 0;
    transition: border-color .15s ease, background .15s ease;
  }
  .check:hover { border-color: var(--accent); }
  .check:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .check svg { width: 14px; height: 14px; stroke: var(--accent-contrast); stroke-width: 3; fill: none;
    stroke-dasharray: 20; stroke-dashoffset: 20; transition: stroke-dashoffset .2s ease .05s; }
  .item.done .check { background: var(--accent); border-color: var(--accent); }
  .item.done .check svg { stroke-dashoffset: 0; }

  .item-label {
    flex: 1;
    font-size: 15px;
    line-height: 1.4;
    word-break: break-word;
    transition: color .2s ease;
  }
  .item.done .item-label {
    color: var(--muted);
    text-decoration: line-through;
    text-decoration-color: color-mix(in srgb, var(--muted) 60%, transparent);
  }

  .del {
    flex: none;
    width: 34px; height: 34px;
    display: grid; place-items: center;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    opacity: 0;
    transition: opacity .15s ease, background .15s ease, color .15s ease;
  }
  .item:hover .del, .del:focus-visible { opacity: 1; }
  .del:hover { background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); }
  .del:focus-visible { outline: 2px solid var(--danger); outline-offset: 1px; }
  .del svg { width: 16px; height: 16px; }
  @media (hover: none) { .del { opacity: 1; } }

  /* ---------- Empty state ---------- */
  .empty {
    text-align: center;
    padding: 56px 16px;
    border: 1px dashed var(--border-strong);
    border-radius: var(--radius);
    color: var(--muted);
  }
  .empty strong { display: block; color: var(--ink-secondary); font-size: 15px; margin-bottom: 4px; font-weight: 600; }
  .empty span { font-size: 13px; }
  .empty.hidden, .progress.hidden, .filters.hidden { display: none; }

  .sr-only {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<main class="app">
  <header class="header">
    <div>
      <h1>Todos</h1>
      <p class="date" id="today"></p>
    </div>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark mode">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <form class="add-bar" id="addForm" autocomplete="off">
    <label class="sr-only" for="newTask">Add a task</label>
    <input class="add-input" id="newTask" type="text" maxlength="200" placeholder="Add a task…" required>
    <button class="add-btn" type="submit" aria-label="Add task">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </form>

  <div class="progress" id="progressRow">
    <div class="progress-track" role="presentation"><div class="progress-fill" id="progressFill"></div></div>
    <span class="progress-count" id="progressCount">0 of 0 done</span>
  </div>

  <div class="filters" id="filterRow" role="group" aria-label="Filter tasks">
    <button class="filter-btn" type="button" data-filter="all" aria-pressed="true">All</button>
    <button class="filter-btn" type="button" data-filter="active" aria-pressed="false">Active</button>
    <button class="filter-btn" type="button" data-filter="done" aria-pressed="false">Done</button>
  </div>

  <ul class="list" id="list"></ul>

  <div class="empty" id="empty">
    <strong id="emptyTitle">No tasks yet</strong>
    <span id="emptyBody">Add your first task above.</span>
  </div>

  <p class="sr-only" role="status" aria-live="polite" id="live"></p>
</main>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "todos.v1";
  var THEME_KEY = "todos.theme";
  var list = document.getElementById("list");
  var form = document.getElementById("addForm");
  var input = document.getElementById("newTask");
  var empty = document.getElementById("empty");
  var emptyTitle = document.getElementById("emptyTitle");
  var emptyBody = document.getElementById("emptyBody");
  var progressRow = document.getElementById("progressRow");
  var progressFill = document.getElementById("progressFill");
  var progressCount = document.getElementById("progressCount");
  var filterRow = document.getElementById("filterRow");
  var live = document.getElementById("live");
  var filterBtns = Array.prototype.slice.call(document.querySelectorAll(".filter-btn"));

  var tasks = load();
  var filter = "all";

  document.getElementById("today").textContent =
    new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });

  /* ---------- Persistence ---------- */
  function load() {
    try {
      var raw = JSON.parse(localStorage.getItem(STORAGE_KEY));
      return Array.isArray(raw) ? raw : [];
    } catch (e) { return []; }
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); } catch (e) {}
  }

  /* ---------- Theme ---------- */
  var root = document.documentElement;
  var savedTheme = null;
  try { savedTheme = localStorage.getItem(THEME_KEY); } catch (e) {}
  root.setAttribute("data-theme",
    savedTheme || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));

  document.getElementById("themeToggle").addEventListener("click", function () {
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  });

  /* ---------- Rendering ---------- */
  function visible() {
    if (filter === "active") return tasks.filter(function (t) { return !t.done; });
    if (filter === "done") return tasks.filter(function (t) { return t.done; });
    return tasks;
  }

  function render() {
    list.innerHTML = "";
    var shown = visible();

    var doneCount = tasks.filter(function (t) { return t.done; }).length;
    var total = tasks.length;
    progressRow.classList.toggle("hidden", total === 0);
    progressCount.textContent = doneCount + " of " + total + " done";
    progressFill.style.width = total ? (doneCount / total * 100) + "%" : "0%";

    filterRow.classList.toggle("hidden", total === 0);

    if (total === 0) {
      empty.classList.remove("hidden");
      emptyTitle.textContent = "No tasks yet";
      emptyBody.textContent = "Add your first task above.";
      return;
    }
    empty.classList.add("hidden");

    if (shown.length === 0) {
      empty.classList.remove("hidden");
      emptyTitle.textContent = filter === "done" ? "Nothing done yet" : "All caught up";
      emptyBody.textContent = filter === "done" ? "Check something off to see it here." : "No active tasks — nice work.";
      return;
    }

    shown.forEach(function (t) {
      var li = document.createElement("li");
      li.className = "item" + (t.done ? " done" : "");
      li.dataset.id = t.id;

      var check = document.createElement("button");
      check.className = "check";
      check.type = "button";
      check.setAttribute("aria-label", (t.done ? "Mark not done: " : "Mark done: ") + t.text);
      check.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12.5l5 5 10-11" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      check.addEventListener("click", function () { toggle(t.id, li); });

      var label = document.createElement("span");
      label.className = "item-label";
      label.textContent = t.text;

      var del = document.createElement("button");
      del.className = "del";
      del.type = "button";
      del.setAttribute("aria-label", "Delete: " + t.text);
      del.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2m-9 0v14a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V6"/></svg>';
      del.addEventListener("click", function () { remove(t.id, li); });

      li.appendChild(check);
      li.appendChild(label);
      li.appendChild(del);
      list.appendChild(li);
    });
  }

  /* ---------- Actions ---------- */
  function add(text) {
    tasks.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), text: text, done: false });
    save();
    render();
    live.textContent = "Task added: " + text;
  }

  function toggle(id, li) {
    var t = tasks.find(function (x) { return x.id === id; });
    if (!t) return;
    t.done = !t.done;
    save();
    // animate in place if still visible, else re-render
    if (filter === "all") {
      li.classList.toggle("done", t.done);
      var check = li.querySelector(".check");
      check.setAttribute("aria-label", (t.done ? "Mark not done: " : "Mark done: ") + t.text);
      updateProgress();
      live.textContent = t.text + (t.done ? " marked done" : " marked active");
    } else {
      render();
      live.textContent = t.text + (t.done ? " moved to done" : " moved to active");
    }
  }

  function remove(id, li) {
    li.classList.add("leaving");
    setTimeout(function () {
      tasks = tasks.filter(function (t) { return t.id !== id; });
      save();
      render();
      live.textContent = "Task deleted";
    }, 180);
  }

  function updateProgress() {
    var doneCount = tasks.filter(function (t) { return t.done; }).length;
    var total = tasks.length;
    progressCount.textContent = doneCount + " of " + total + " done";
    progressFill.style.width = total ? (doneCount / total * 100) + "%" : "0%";
  }

  /* ---------- Wiring ---------- */
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var text = input.value.trim();
    if (!text) return;
    add(text);
    input.value = "";
    input.focus();
  });

  filterBtns.forEach(function (btn) {
    btn.addEventListener("click", function () {
      filter = btn.dataset.filter;
      filterBtns.forEach(function (b) { b.setAttribute("aria-pressed", b === btn ? "true" : "false"); });
      render();
    });
  });

  render();
})();
</script>
</body>
</html>
