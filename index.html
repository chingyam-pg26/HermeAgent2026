<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navigator · Web 專案導覽</title>
<style>
:root{
  --bg:#f4f6f8; --surface:#ffffff; --ink:#1a1d21; --ink-2:#4a5460; --muted:#6b7683;
  --line:#dde3e8; --line-strong:#c3ccd4;
  --accent:#0f766e; --accent-soft:#e6f4f2;
  --live:#166534; --live-soft:#e8f3ec;
  --dev:#b45309; --dev-soft:#fdf3e3;
  --radius:12px; --shadow:0 1px 2px rgba(16,24,32,.06),0 4px 14px rgba(16,24,32,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,"Segoe UI","PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.55;font-size:15px}
.wrap{max-width:1080px;margin:0 auto;padding:28px 16px 48px}

/* ---------- header ---------- */
.masthead{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:24px 26px;margin-bottom:18px}
.masthead h1{font-size:clamp(20px,3vw,26px);letter-spacing:-.01em}
.masthead .sub{color:var(--ink-2);font-size:14px;margin-top:4px;max-width:72ch}
.masthead .meta{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:13px;color:var(--muted)}
.masthead .meta strong{color:var(--ink-2)}

/* ---------- controls ---------- */
.controls{display:flex;flex-direction:column;gap:12px;margin-bottom:18px}
.search{min-height:44px;padding:10px 14px;border:1px solid var(--line-strong);border-radius:10px;
  background:var(--surface);color:var(--ink);font:inherit;font-size:15px;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips .lbl{font-size:12px;font-weight:700;color:var(--muted);margin-right:2px}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:99px;
  padding:6px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink-2)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chip.cat[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.result-note{font-size:13px;color:var(--muted)}

/* ---------- cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:10px;
  transition:transform .15s ease,box-shadow .15s ease}
.card:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(16,24,32,.08),0 10px 24px rgba(16,24,32,.12)}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card h2{font-size:17px;line-height:1.3}
.badge{font-size:11px;font-weight:700;border-radius:99px;padding:3px 10px;white-space:nowrap}
.badge.live{background:var(--live-soft);color:var(--live)}
.badge.dev{background:var(--dev-soft);color:var(--dev)}
.card .desc{font-size:13px;color:var(--ink-2);flex:1}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags .tag{font-size:11px;font-weight:600;background:#eef1f4;border:1px solid var(--line);
  color:var(--ink-2);border-radius:6px;padding:2px 8px}
.tags .tag.cat{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.card .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;
  border-top:1px solid var(--line);padding-top:10px}
.open-btn{background:var(--accent);color:#fff;text-decoration:none;font-size:13px;font-weight:700;
  border-radius:8px;padding:8px 16px;display:inline-block}
.open-btn:hover{filter:brightness(.94)}
.open-btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.card .where{font-size:11px;color:var(--muted)}
.empty{padding:40px 16px;text-align:center;color:var(--muted);font-size:14px;
  border:1px dashed var(--line-strong);border-radius:var(--radius);background:var(--surface)}
.err{padding:20px;background:var(--dev-soft);border:1px solid #f0c79a;color:#7c3f06;
  border-radius:var(--radius);font-size:14px}
.err code{font-size:12px;background:#fff;border:1px solid #f0c79a;border-radius:4px;padding:1px 6px}

footer{margin-top:28px;font-size:12px;color:var(--muted);text-align:center}
footer code{font-size:11px;background:#eef1f4;border-radius:4px;padding:1px 6px}

/* ---------- print ---------- */
@media print{
  body{background:#fff}
  .wrap{max-width:none;padding:0}
  .masthead,.card{box-shadow:none}
  .controls .search,.chips{display:none!important}
  .grid{grid-template-columns:1fr 1fr}
  .card:hover{transform:none}
  .open-btn{border:1px solid var(--line-strong);color:var(--ink);background:#fff}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <h1>Navigator · Web 專案導覽</h1>
    <p class="sub">集中瀏覽所有上線與開發中的網頁專案。搜尋、分類與狀態篩選皆在前端完成；新增專案只需編輯倉庫內的 <code>projects.json</code> 並 push，即自動部署上線。</p>
    <div class="meta">
      <span>專案數：<strong id="totalNote">—</strong></span>
      <span>最後更新：<strong id="updatedNote">—</strong></span>
    </div>
  </header>

  <div class="controls" aria-label="搜尋與篩選">
    <input class="search" id="q" type="search" placeholder="搜尋專案名稱、簡介、技術或分類…" aria-label="搜尋專案">
    <div class="chips" id="catChips" role="group" aria-label="分類篩選"><span class="lbl">分類</span></div>
    <div class="chips" id="stChips" role="group" aria-label="狀態篩選"><span class="lbl">狀態</span></div>
    <p class="result-note" id="resultNote" aria-live="polite"></p>
  </div>

  <main id="grid" class="grid" aria-label="專案卡片列表"></main>
  <div class="empty" id="empty" hidden>沒有符合目前條件的專案。</div>
  <div class="err" id="errBox" hidden></div>

  <footer>新增專案：在倉庫 <code>projects.json</code> 加入一筆（name / url / description / stack / category / status）後 push 到 main，GitHub Actions 會自動建置並部署。</footer>
</div>

<script>
"use strict";
const STATUS = {live:"已上線", dev:"開發中"};
const state = {q:"", cat:"all", status:"all"};
let PROJECTS = [], CATEGORIES = [];

const $ = id => document.getElementById(id);

function esc(s){ const d=document.createElement("div"); d.textContent = String(s ?? ""); return d.innerHTML; }

function renderChips(){
  const cc=$("catChips"), sc=$("stChips");
  cc.innerHTML='<span class="lbl">分類</span>';
  sc.innerHTML='<span class="lbl">狀態</span>';
  const mk=(wrap, val, label, cls) => {
    const b=document.createElement("button");
    b.type="button"; b.className="chip "+(cls||""); b.textContent=label;
    b.dataset.val=val;
    b.setAttribute("aria-pressed", val==="all" ? "true":"false");
    b.addEventListener("click", ()=>{
      if(wrap.id==="catChips") state.cat = (state.cat===val?"all":val);
      else state.status = (state.status===val?"all":val);
      syncChips(); renderCards();
    });
    wrap.appendChild(b);
    return b;
  };
  mk(cc,"all","全部","cat");
  CATEGORIES.forEach(c=> mk(cc,c,c,"cat"));
  mk(sc,"all","全部","st");
  Object.keys(STATUS).forEach(s=> mk(sc,s,STATUS[s],"st"));
}
function syncChips(){
  document.querySelectorAll("#catChips .chip").forEach(b=>
    b.setAttribute("aria-pressed", String(state.cat===b.dataset.val)));
  document.querySelectorAll("#stChips .chip").forEach(b=>
    b.setAttribute("aria-pressed", String(state.status===b.dataset.val)));
}

function visible(){
  const q=state.q.trim().toLowerCase();
  return PROJECTS.filter(p=>{
    const hay=[p.name,p.description,(p.stack||[]).join(" "),p.category].join(" ").toLowerCase();
    return (!q || hay.includes(q))
      && (state.cat==="all" || p.category===state.cat)
      && (state.status==="all" || p.status===state.status);
  });
}

function renderCards(){
  const grid=$("grid"); grid.innerHTML="";
  const rows=visible();
  rows.forEach(p=>{
    const st = STATUS[p.status] ? p.status : "";
    const art=document.createElement("article");
    art.className="card"; art.setAttribute("tabindex","0");
    art.setAttribute("aria-label", p.name+"，"+(STATUS[st]||"狀態未定"));
    art.innerHTML = `
      <div class="top">
        <h2>${esc(p.name)}</h2>
        <span class="badge ${st||"dev"}">${esc(STATUS[st]||p.status||"開發中")}</span>
      </div>
      <p class="desc">${esc(p.description)}</p>
      <div class="tags">
        ${p.category?`<span class="tag cat">${esc(p.category)}</span>`:""}
        ${(p.stack||[]).map(s=>`<span class="tag">${esc(s)}</span>`).join("")}
      </div>
      <div class="foot">
        <a class="open-btn" href="${esc(p.url)}" target="_blank" rel="noopener">開啟專案 →</a>
        <span class="where">${esc(p.url)}</span>
      </div>`;
    grid.appendChild(art);
  });
  $("empty").hidden = rows.length>0;
  $("resultNote").textContent = rows.length===PROJECTS.length
    ? `顯示全部 ${rows.length} 個專案`
    : `顯示 ${rows.length}／${PROJECTS.length} 個專案`;
}

$("q").addEventListener("input", e=>{ state.q=e.target.value; renderCards(); });

(function init(){
  fetch("projects.json", {cache:"no-store"})
    .then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(j=>{
      PROJECTS = j.projects || [];
      CATEGORIES = [...new Set(PROJECTS.map(p=>p.category).filter(Boolean))];
      $("totalNote").textContent = PROJECTS.length+" 個";
      $("updatedNote").textContent = j.updated || "未標註";
      renderChips(); syncChips(); renderCards();
    })
    .catch(e=>{
      $("errBox").hidden=false;
      $("errBox").innerHTML = `無法載入 <code>projects.json</code>（${esc(e.message)}）。請確認檔案與本頁同在站根目錄，並以 HTTPS 或 localhost 開啟。`;
      $("totalNote").textContent="0 個";
    });
})();
</script>
</body>
</html>
